# Syncs the coin database (db.hpp + weapons[] in config.cpp) against the TTT squad rosters
# and opens a pull request with any new entries. Keeping this out of the release build means
# every coin classname <-> UID assignment is committed once and stays stable across releases.

name: Sync Coin Database

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync coin database
        run: python tools/sync_coin_db.py

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-coin-db
          delete-branch: true
          commit-message: Sync coin database with squad rosters
          title: Sync coin database with squad rosters
          body: Adds coins for new squad members, generated by `tools/sync_coin_db.py`.
          add-paths: |
            addons/coin_check/db.hpp
            addons/coin_check/config.cpp
